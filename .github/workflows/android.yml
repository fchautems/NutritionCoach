name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, iteration/01-aujourdhui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Interface tests
        run: |
          test_deps="$(mktemp -d)"
          npm install --prefix "$test_deps" --no-package-lock jsdom@26.1.0
          NODE_PATH="$test_deps/node_modules" node --test tests/profile-ui.test.cjs

      - name: Build preview APK
        run: gradle --no-daemon :app:assemblePreview

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutritionCoach-preview-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download preview
        uses: actions/download-artifact@v4
        with:
          name: NutritionCoach-preview-apk

      - name: Name APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mv app-preview.apk "NutritionCoach-${RELEASE_TAG}-preview.apk"

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Aperçu Android installable à côté de la V0.1.
            Le journal de l’aperçu est indépendant de celui de la V0.1.
          files: NutritionCoach-*-preview.apk
          prerelease: true
          fail_on_unmatched_files: true
