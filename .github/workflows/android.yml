name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NutritionCoach-v0.1.0-debug.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutritionCoach-v0.1.0-apk
          path: NutritionCoach-v0.1.0-debug.apk
          if-no-files-found: error

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: NutritionCoach v0.1.0 - POC
          body: |
            Première version de test : saisie des aliments, calories du jour,
            objectif modifiable, historique quotidien et stockage local.
            APK de debug signé automatiquement pour installation manuelle.
          files: NutritionCoach-v0.1.0-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
